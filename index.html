<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WangKu - Pengurus Kewangan Anda</title>
    
    <!-- Konfigurasi Tailwind untuk Mod Gelap -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
    
    <!-- Skrip Inisialisasi Mod Gelap -->
    <script>
        if (localStorage.getItem('wangku_theme') === 'dark' || (!('wangku_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-indigo-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-screen w-screen overflow-hidden flex justify-center transition-colors duration-300">

    <!-- Container Utama -->
    <div class="w-full max-w-md h-full bg-slate-50 dark:bg-slate-900 shadow-2xl relative flex flex-col overflow-hidden transition-colors duration-300">
        
        <!-- Auth Container -->
        <div id="auth-container" class="absolute inset-0 bg-white dark:bg-slate-900 z-40 flex flex-col justify-center px-8 transition-all duration-500">
            <div class="text-center mb-8">
                <div class="w-24 h-24 mx-auto mb-4 shadow-xl rounded-3xl overflow-hidden flex items-center justify-center bg-white dark:bg-slate-800">
                    <img src="image_7e72c0.jpg" onerror="this.src='https://placehold.co/200x200/4f46e5/ffffff?text=WK'" alt="WangKu Logo" class="w-full h-full object-cover">
                </div>
                <h1 class="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">WangKu</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mt-1">Urus kewangan anda dengan mudah</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Nama Penuh</label>
                    <input type="text" id="auth-name" placeholder="Nama anda" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">E-mel</label>
                    <input type="email" id="auth-email" required placeholder="emel@anda.com" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Kata Laluan</label>
                    <div class="relative">
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-2xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                        <button type="button" onclick="window.togglePassword('auth-password', 'eye-icon-auth')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                            <i id="eye-icon-auth" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div id="forgot-password-container" class="mt-2 text-right">
                        <button type="button" onclick="window.openForgotModal()" class="text-xs text-indigo-500 dark:text-indigo-400 font-medium hover:text-indigo-600 dark:hover:text-indigo-300 transition-colors">Lupa kata laluan?</button>
                    </div>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-500 dark:bg-indigo-600 text-white font-semibold rounded-2xl py-4 mt-4 shadow-md shadow-indigo-200 dark:shadow-none hover:bg-indigo-600 dark:hover:bg-indigo-500 active:scale-95 transition-all">
                    Log Masuk
                </button>
            </form>

            <div class="mt-6 text-center">
                <button onclick="window.toggleAuthMode()" id="auth-toggle-btn" class="text-sm text-indigo-500 dark:text-indigo-400 font-medium hover:text-indigo-600">
                    Belum ada akaun? Daftar sekarang
                </button>
            </div>
        </div>

        <!-- App Container -->
        <div id="app-container" class="h-full w-full flex flex-col opacity-0 pointer-events-none transition-opacity duration-500">
            
            <!-- Header -->
            <header class="pt-8 pb-4 px-6 bg-white dark:bg-slate-800 rounded-b-[2rem] shadow-sm z-10 transition-colors duration-300">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-sm flex items-center justify-center bg-white dark:bg-slate-800">
                            <img src="image_7e72c0.jpg" onerror="this.src='https://placehold.co/100x100/4f46e5/ffffff?text=WK'" alt="WangKu Logo" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight">WangKu</h1>
                            <p class="text-xs text-indigo-500 dark:text-indigo-400 font-semibold" id="user-greeting">Memuatkan...</p>
                        </div>
                    </div>
                    <!-- Butang Profil (Header) -->
                    <button onclick="window.openProfileModal()" class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-700 text-slate-500 dark:text-slate-300 flex justify-center items-center hover:bg-indigo-100 dark:hover:bg-indigo-900 transition-colors shadow-sm border border-slate-100 dark:border-slate-600 overflow-hidden relative">
                        <img id="header-profile-pic" src="" class="w-full h-full object-cover hidden" alt="Profile">
                        <i id="header-profile-icon" class="fa-solid fa-user"></i>
                    </button>
                </div>

                <!-- Kad Dashboard -->
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 dark:from-indigo-600 dark:to-purple-800 rounded-3xl p-6 text-white shadow-lg shadow-indigo-200 dark:shadow-none">
                    <p class="text-indigo-100 dark:text-indigo-200 text-sm font-medium mb-1">Baki Semasa</p>
                    <h2 class="text-4xl font-bold mb-6">RM <span id="balance-amount">0.00</span></h2>
                    
                    <div class="flex justify-between items-center border-t border-indigo-400/30 pt-4">
                        <div>
                            <p class="text-indigo-200 text-xs font-medium mb-1">Pendapatan</p>
                            <p class="font-semibold text-emerald-300">+RM <span id="income-amount">0.00</span></p>
                        </div>
                        <div class="text-right">
                            <p class="text-indigo-200 text-xs font-medium mb-1">Perbelanjaan</p>
                            <p class="font-semibold text-rose-300">-RM <span id="expense-amount">0.00</span></p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto p-6 pb-24">
                
                <!-- Carta Pai -->
                <div id="chart-container" class="bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 mb-6 hidden transition-colors duration-300">
                    <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200 mb-3 text-center">Analisis Perbelanjaan</h3>
                    <div class="relative h-48 w-full flex justify-center items-center">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

                <div class="flex justify-between items-end mb-4">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white">Rekod Terkini</h3>
                    <button onclick="window.openHistoryModal()" class="text-sm font-bold text-indigo-500 dark:text-indigo-400 hover:text-indigo-600 transition-colors">Lihat Semua</button>
                </div>
                
                <div id="expense-list" class="space-y-3 pb-8">
                    <!-- Senarai -->
                </div>
            </main>

            <!-- Butang Tambah (+) -->
            <div class="absolute bottom-8 left-0 right-0 flex justify-center pointer-events-none">
                <button onclick="window.openModal()" class="pointer-events-auto bg-indigo-500 dark:bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg shadow-indigo-300 dark:shadow-none flex items-center justify-center text-2xl hover:bg-indigo-600 active:scale-90 transition-all z-20">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Modal Tambah Rekod -->
            <div id="add-modal" class="absolute inset-0 z-50 hidden items-end justify-center bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-sm transition-opacity">
                <div id="modal-content" class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-[2rem] p-6 pb-8 transform translate-y-full transition-transform duration-300 shadow-2xl h-[85%] overflow-y-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h3 id="modal-title" class="text-xl font-bold text-slate-800 dark:text-white">Tambah Rekod</h3>
                        <button onclick="window.closeModal()" class="w-8 h-8 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center text-slate-500 dark:text-slate-400 active:bg-slate-200 dark:active:bg-slate-600">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <form id="expense-form" class="space-y-4">
                        <input type="hidden" id="edit-record-id" value="">
                        <div class="flex bg-slate-100 dark:bg-slate-700/50 rounded-xl p-1 mb-2">
                            <button type="button" id="btn-expense" class="flex-1 py-2 rounded-lg bg-white dark:bg-slate-600 shadow-sm text-rose-500 dark:text-rose-400 font-bold text-sm transition-all" onclick="window.setTxType('expense')">Keluar (-)</button>
                            <button type="button" id="btn-income" class="flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400 font-medium text-sm transition-all" onclick="window.setTxType('income')">Masuk (+)</button>
                        </div>
                        
                        <input type="hidden" id="tx-type" value="expense">

                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Jumlah (RM)</label>
                            <input type="number" id="amount" step="0.01" required placeholder="0.00" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Kategori</label>
                            <select id="category" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all appearance-none">
                                <option value="Makanan">🍔 Makanan & Minuman</option>
                                <option value="Pengangkutan">🚗 Pengangkutan</option>
                                <option value="Membeli-belah">🛍️ Membeli-belah</option>
                                <option value="Bil">💡 Bil & Utiliti</option>
                                <option value="Hiburan">🎬 Hiburan</option>
                                <option value="Lain-lain">📦 Lain-lain</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Tarikh</label>
                            <input type="date" id="date" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Keterangan (Pilihan)</label>
                            <input type="text" id="description" placeholder="Contoh: Makan tengahari / Gaji" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                        </div>

                        <!-- Bahagian Muat Naik Resit -->
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Gambar Resit (Pilihan)</label>
                            <div class="flex items-center gap-4">
                                <button type="button" onclick="document.getElementById('receipt-input').click()" class="bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 px-4 py-3 rounded-2xl text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors flex-1 flex items-center justify-center">
                                    <i class="fa-solid fa-camera mr-2"></i> Muat Naik
                                </button>
                                <input type="file" id="receipt-input" class="hidden" accept="image/*" onchange="window.handleReceiptUpload(event)">
                                <div id="receipt-preview-container" class="hidden relative w-14 h-14 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-600 shrink-0 shadow-sm">
                                    <img id="receipt-preview-img" src="" class="w-full h-full object-cover">
                                    <button type="button" onclick="window.removeReceipt()" class="absolute top-0 right-0 bg-rose-500/90 text-white w-5 h-5 flex items-center justify-center rounded-bl-xl text-xs hover:bg-rose-600">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-indigo-500 dark:bg-indigo-600 text-white font-semibold rounded-2xl py-4 mt-2 shadow-md shadow-indigo-200 dark:shadow-none hover:bg-indigo-600 active:scale-95 transition-all">
                            Simpan Rekod
                        </button>
                    </form>
                </div>
            </div>

            <!-- Modal Profil -->
            <div id="profile-modal" class="absolute inset-0 z-50 hidden items-end justify-center bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-sm transition-opacity">
                <div id="profile-modal-content" class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-[2rem] p-6 pb-8 transform translate-y-full transition-transform duration-300 shadow-2xl h-[90%] overflow-y-auto flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-slate-800 dark:text-white">Profil Saya</h3>
                        <button onclick="window.closeProfileModal()" class="w-8 h-8 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center text-slate-500 dark:text-slate-400 active:bg-slate-200">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Gambar Profil & Upload -->
                    <div class="flex flex-col items-center mb-6">
                        <div class="relative cursor-pointer group" onclick="document.getElementById('profile-image-input').click()">
                            <div class="w-24 h-24 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center text-indigo-500 dark:text-indigo-400 text-4xl mb-2 shadow-sm overflow-hidden relative border-4 border-white dark:border-slate-700">
                                <img id="profile-modal-pic" src="" class="w-full h-full object-cover hidden" alt="Profile">
                                <i id="profile-modal-icon" class="fa-solid fa-user"></i>
                                
                                <!-- Overlay Hover (Kamera) -->
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fa-solid fa-camera text-white text-xl"></i>
                                </div>
                            </div>
                        </div>
                        <p class="text-sm font-medium text-slate-500 dark:text-slate-400" id="profile-email-display">emel@anda.com</p>
                        <!-- Input Fail Gambar (Tersembunyi) -->
                        <input type="file" id="profile-image-input" class="hidden" accept="image/*" onchange="window.handleImageUpload(event)">
                    </div>

                    <form id="profile-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Nama Penuh</label>
                            <input type="text" id="profile-name" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Tukar Kata Laluan (Pilihan)</label>
                            <div class="relative">
                                <input type="password" id="profile-password" placeholder="Biarkan kosong jika tiada pertukaran" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all">
                                <button type="button" onclick="window.togglePassword('profile-password', 'eye-icon-profile')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                    <i id="eye-icon-profile" class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-indigo-500 dark:bg-indigo-600 text-white font-semibold rounded-2xl py-4 shadow-md shadow-indigo-200 dark:shadow-none hover:bg-indigo-600 active:scale-95 transition-all">
                            Simpan Perubahan
                        </button>
                    </form>

                    <!-- Tetapan Tema (Mod Gelap) -->
                    <div class="flex items-center justify-between mt-6 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-2xl border border-slate-100 dark:border-slate-700">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white dark:bg-slate-600 rounded-full flex items-center justify-center text-slate-500 dark:text-slate-300 shadow-sm">
                                <i class="fa-solid fa-moon"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-slate-800 dark:text-white">Mod Gelap</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400">Tukar tema paparan</p>
                            </div>
                        </div>
                        <button id="dark-mode-toggle" onclick="window.toggleDarkMode()" class="w-12 h-6 bg-slate-300 dark:bg-indigo-500 rounded-full relative transition-colors duration-300">
                            <div id="dark-mode-circle" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform duration-300"></div>
                        </button>
                    </div>
                    
                    <!-- Butang Log Keluar -->
                    <button onclick="window.logout()" class="w-full bg-rose-50 dark:bg-rose-900/30 text-rose-500 dark:text-rose-400 font-semibold rounded-2xl py-4 mt-6 shadow-sm hover:bg-rose-100 dark:hover:bg-rose-900/50 active:scale-95 transition-all border border-rose-100 dark:border-rose-900/50">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Log Keluar
                    </button>
                </div>
            </div>

            <!-- Modal Sejarah (History) -->
            <div id="history-modal" class="absolute inset-0 z-[55] hidden flex-col bg-slate-50 dark:bg-slate-900 transform translate-y-full transition-transform duration-300">
                <div class="pt-8 pb-4 px-6 bg-white dark:bg-slate-800 shadow-sm flex items-center justify-between shrink-0 rounded-b-[2rem] transition-colors duration-300">
                    <div class="flex items-center gap-3">
                        <button onclick="window.closeHistoryModal()" class="w-10 h-10 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 active:bg-slate-200">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <h3 class="text-xl font-bold text-slate-800 dark:text-white">Sejarah Transaksi</h3>
                    </div>
                </div>
                
                <div class="px-6 py-4 shrink-0">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider">Tapis mengikut bulan</label>
                    <select id="history-month-filter" onchange="window.filterHistory()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 font-medium shadow-sm appearance-none">
                        <option value="all">Semua Bulan</option>
                    </select>
                </div>

                <div id="history-list-container" class="flex-1 overflow-y-auto px-6 pb-24 space-y-3">
                    <!-- Senarai -->
                </div>
            </div>

            <!-- Toast -->
            <div id="toast" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 dark:bg-slate-700 text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium transition-all duration-300 opacity-0 pointer-events-none z-[80] flex items-center gap-2">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span id="toast-message">Berjaya!</span>
            </div>

            <!-- Modal Lupa Kata Laluan -->
            <div id="forgot-modal" class="absolute inset-0 z-[70] hidden items-center justify-center bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-sm transition-opacity">
                <div id="forgot-modal-content" class="bg-white dark:bg-slate-800 w-[90%] max-w-sm rounded-3xl p-6 transform scale-95 opacity-0 transition-all duration-300 shadow-2xl">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-slate-800 dark:text-white">Set Semula Akses</h3>
                        <button onclick="window.closeForgotModal()" class="w-8 h-8 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center text-slate-500 dark:text-slate-400 active:bg-slate-200">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <form id="forgot-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">E-mel Akaun</label>
                            <input type="email" id="forgot-email" required placeholder="emel@anda.com" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Kata Laluan Baharu</label>
                            <div class="relative">
                                <input type="password" id="forgot-password-new" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-2xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                                <button type="button" onclick="window.togglePassword('forgot-password-new', 'eye-icon-forgot')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                    <i id="eye-icon-forgot" class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-500 dark:bg-indigo-600 text-white font-semibold rounded-2xl py-4 mt-2 shadow-md hover:bg-indigo-600 active:scale-95 transition-all">
                            Tukar Kata Laluan
                        </button>
                    </form>
                </div>
            </div>

            <!-- Modal Lihat Resit (Zoom) -->
            <div id="receipt-view-modal" class="absolute inset-0 z-[80] hidden items-center justify-center bg-slate-900/90 backdrop-blur-md transition-opacity">
                <div class="relative w-[90%] max-w-sm flex flex-col items-center">
                    <div class="w-full flex justify-end mb-4">
                        <button onclick="window.closeReceiptView()" class="w-10 h-10 bg-slate-800 text-white rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors shadow-lg border border-slate-600">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                    <img id="receipt-full-img" src="" class="w-full rounded-2xl shadow-2xl max-h-[70vh] object-contain border border-slate-700 bg-slate-800">
                </div>
            </div>

        </div> <!-- End App Container -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wangku-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        let app, db, auth;
        let currentUser = null;
        let expensesData = [];
        let isLoginMode = true;
        let expenseChartInstance = null; 
        let currentReceiptDataUrl = null; 
        let unsubscribeExpenses = null;

        // -- Pengurusan Mod Gelap (Dark Mode) --
        function updateDarkModeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const circle = document.getElementById('dark-mode-circle');
            if(circle) {
                if(isDark) {
                    circle.classList.add('translate-x-6');
                } else {
                    circle.classList.remove('translate-x-6');
                }
            }
            
            // Kemaskini warna font carta jika ada
            if(expenseChartInstance) {
                Chart.defaults.color = isDark ? '#cbd5e1' : '#64748b';
                expenseChartInstance.update();
            }
        }

        window.toggleDarkMode = () => {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('wangku_theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('wangku_theme', 'dark');
            }
            updateDarkModeUI();
        };

        // Initialize Theme UI on load
        window.addEventListener('DOMContentLoaded', () => {
            updateDarkModeUI();
            Chart.defaults.color = document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#64748b';
            Chart.defaults.font.family = "'Poppins', sans-serif";
            initCloud(); // Mula sambungan awan bila UI sedia
        });

        async function initCloud() {
            if (Object.keys(firebaseConfig).length === 0) {
                console.warn("Konfigurasi awan tiada.");
                return;
            }
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                initAuth();
            } catch (error) { 
                console.error("Cloud error", error); 
                showToast("Gagal menyambung ke awan", "error");
            }
        }

        // -- Inisialisasi Auth --
        async function initAuth() {
            const savedEmail = localStorage.getItem('wangku_session');
            if (savedEmail && auth && auth.currentUser) {
                try {
                    const userDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wangku_users', savedEmail));
                    if (userDoc.exists()) {
                        currentUser = { uid: savedEmail, displayName: userDoc.data().name, profilePic: userDoc.data().profilePic };
                        showApp();
                        document.getElementById('user-greeting').innerText = `Hai, ${currentUser.displayName}! 👋`;
                        updateProfilePictures();
                        loadExpensesFromCloud();
                        return;
                    }
                } catch(e) { console.error(e); }
            }
            
            localStorage.removeItem('wangku_session');
            currentUser = null;
            showAuth();
        }

        // -- Paparan Gambar Profil --
        function updateProfilePictures() {
            const headerPic = document.getElementById('header-profile-pic');
            const headerIcon = document.getElementById('header-profile-icon');
            const modalPic = document.getElementById('profile-modal-pic');
            const modalIcon = document.getElementById('profile-modal-icon');

            if (currentUser && currentUser.profilePic) {
                headerPic.src = currentUser.profilePic;
                modalPic.src = currentUser.profilePic;
                
                headerPic.classList.remove('hidden');
                modalPic.classList.remove('hidden');
                headerIcon.classList.add('hidden');
                modalIcon.classList.add('hidden');
            } else {
                headerPic.classList.add('hidden');
                modalPic.classList.add('hidden');
                headerIcon.classList.remove('hidden');
                modalIcon.classList.remove('hidden');
            }
        }

        // -- Muat Naik Gambar Profil --
        window.handleImageUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Kecilkan ke maksimum 200x200 untuk elak storage penuh
                    const MAX_SIZE = 200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Tukar ke format data (Base64)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Simpan
                    currentUser.profilePic = dataUrl;
                    updateProfilePictures();
                    showToast("Gambar profil dikemas kini! Menyimpan ke awan...");
                    
                    if (auth && auth.currentUser) {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wangku_users', currentUser.uid), { profilePic: dataUrl }, { merge: true })
                            .then(() => showToast("Gambar disimpan di awan!"))
                            .catch(e => console.error(e));
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

        // -- Auth Form (Login/Daftar) --
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;
            const btn = document.getElementById('auth-submit-btn');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyambung...';
            btn.disabled = true;

            try {
                if (!auth || !auth.currentUser) throw new Error("Awan tidak sedia");
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'wangku_users', email);
                const userSnap = await getDoc(userRef);

                if (isLoginMode) {
                    if (userSnap.exists() && userSnap.data().password === password) {
                        localStorage.setItem('wangku_session', email);
                        showToast("Berjaya log masuk!");
                        initAuth();
                    } else {
                        showToast("E-mel atau kata laluan salah.", "error");
                    }
                } else {
                    if (userSnap.exists()) {
                        showToast("E-mel telah digunakan.", "error");
                    } else {
                        await setDoc(userRef, { name: name, password: password, profilePic: null });
                        localStorage.setItem('wangku_session', email);
                        showToast("Akaun berjaya didaftarkan!");
                        initAuth();
                    }
                }
            } catch (err) {
                showToast("Ralat sistem awan", "error");
                console.error(err);
            }
            
            btn.innerHTML = isLoginMode ? 'Log Masuk' : 'Daftar Akaun';
            btn.disabled = false;
        });

        window.logout = () => {
            localStorage.removeItem('wangku_session');
            currentUser = null;
            expensesData = []; 
            if (unsubscribeExpenses) unsubscribeExpenses();
            document.getElementById('auth-form').reset();
            window.closeProfileModal();
            updateUI();
            showToast("Berjaya log keluar.");
            initAuth();
        };

        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            const nameField = document.getElementById('name-field');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toggleBtn = document.getElementById('auth-toggle-btn');
            const authName = document.getElementById('auth-name');
            const forgotContainer = document.getElementById('forgot-password-container');

            if (isLoginMode) {
                nameField.classList.add('hidden');
                forgotContainer.classList.remove('hidden');
                authName.required = false;
                submitBtn.innerText = 'Log Masuk';
                toggleBtn.innerText = 'Belum ada akaun? Daftar sekarang';
            } else {
                nameField.classList.remove('hidden');
                forgotContainer.classList.add('hidden');
                authName.required = true;
                submitBtn.innerText = 'Daftar Akaun';
                toggleBtn.innerText = 'Sudah ada akaun? Log masuk';
            }
        };

        function showAuth() {
            document.getElementById('auth-container').classList.remove('-translate-y-full');
            document.getElementById('app-container').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('app-container').classList.remove('opacity-100', 'pointer-events-auto');
        }

        function showApp() {
            document.getElementById('auth-container').classList.add('-translate-y-full');
            document.getElementById('app-container').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('app-container').classList.add('opacity-100', 'pointer-events-auto');
        }

        // -- Data & UI Perbelanjaan --
        function loadExpensesFromCloud() {
            if (!currentUser || !auth.currentUser) return;
            if (unsubscribeExpenses) unsubscribeExpenses();
            
            const expRef = collection(db, 'artifacts', appId, 'public', 'data', 'wangku_expenses');
            unsubscribeExpenses = onSnapshot(expRef, (snapshot) => {
                const allData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // Tapis (filter) rekod dari awan untuk akaun semasa sahaja
                expensesData = allData.filter(d => d.userEmail === currentUser.uid);
                expensesData.sort((a, b) => b.timestamp - a.timestamp);
                
                updateUI();
                
                const historyModal = document.getElementById('history-modal');
                if (!historyModal.classList.contains('hidden')) {
                    renderHistoryList(document.getElementById('history-month-filter').value);
                }
            }, (error) => {
                console.error("Ralat membaca rekod:", error);
            });
        }

        function updateUI() {
            const listContainer = document.getElementById('expense-list');
            const balanceElement = document.getElementById('balance-amount');
            const incomeElement = document.getElementById('income-amount');
            const expenseElement = document.getElementById('expense-amount');
            
            let totalIncome = 0;
            let totalExpense = 0;
            
            listContainer.innerHTML = '';
            
            expensesData.forEach(item => {
                const amt = parseFloat(item.amount);
                if (item.type === 'income') totalIncome += amt;
                else totalExpense += amt;
            });

            if (expensesData.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-slate-400 dark:text-slate-500">
                        <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-3xl mb-4">
                            <i class="fa-solid fa-receipt"></i>
                        </div>
                        <p>Tiada rekod lagi, ${currentUser ? currentUser.displayName : 'kawan'}.</p>
                        <p class="text-sm mt-1">Tekan + untuk mula menjejak.</p>
                    </div>
                `;
                balanceElement.innerText = "0.00";
                incomeElement.innerText = "0.00";
                expenseElement.innerText = "0.00";
                renderChart(expensesData);
                return;
            }

            const recentData = expensesData.slice(0, 5);

            recentData.forEach(item => {
                const amt = parseFloat(item.amount);
                const isIncome = item.type === 'income';
                let iconInfo = getCategoryIconInfo(item.category, isIncome);
                
                const dateObj = new Date(item.date);
                const dateStr = dateObj.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' });
                const amountStyle = isIncome ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400';
                const amountPrefix = isIncome ? '+RM' : '-RM';
            
            let receiptBtnHtml = item.receipt 
                ? `<button onclick="window.viewReceipt('${item.id}')" class="flex items-center gap-1 text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-2 py-1 rounded-lg mt-1 hover:bg-slate-200"><i class="fa-solid fa-receipt"></i> Resit</button>` 
                : '';

            const card = document.createElement('div');
            card.className = "bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between";
            card.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl ${iconInfo.bg} flex items-center justify-center text-xl shadow-sm shrink-0">
                        ${iconInfo.icon}
                    </div>
                    <div>
                        <h4 class="font-semibold text-slate-700 dark:text-slate-200">${item.category}</h4>
                        <p class="text-xs text-slate-400 dark:text-slate-500 line-clamp-1">${dateStr} • ${item.description || 'Tiada keterangan'}</p>
                        ${receiptBtnHtml}
                    </div>
                </div>
                <div class="flex flex-col items-end justify-between min-h-[48px]">
                    <span class="font-bold ${amountStyle} whitespace-nowrap">${amountPrefix} ${amt.toFixed(2)}</span>
                    <div class="flex gap-2 mt-2">
                        <button class="text-slate-300 dark:text-slate-500 hover:text-indigo-500 dark:hover:text-indigo-400 text-xs w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-700 flex items-center justify-center transition-colors shadow-sm" onclick="window.openEditModal('${item.id}')" title="Edit">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="text-slate-300 dark:text-slate-500 hover:text-rose-500 dark:hover:text-rose-400 text-xs w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-700 flex items-center justify-center transition-colors shadow-sm" onclick="window.deleteRecord('${item.id}')" title="Padam">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
            });
            
            balanceElement.innerText = (totalIncome - totalExpense).toFixed(2);
            incomeElement.innerText = totalIncome.toFixed(2);
            expenseElement.innerText = totalExpense.toFixed(2);
            
            renderChart(expensesData);
        }

        // -- Carta Pai --
        function renderChart(data) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const chartContainer = document.getElementById('chart-container');
            const expenses = data.filter(item => item.type === 'expense');
            
            if (expenses.length === 0) {
                chartContainer.classList.add('hidden');
                if (expenseChartInstance) { expenseChartInstance.destroy(); expenseChartInstance = null; }
                return;
            }

            chartContainer.classList.remove('hidden');
            const categoryTotals = {};
            expenses.forEach(exp => {
                categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + parseFloat(exp.amount);
            });

            const labels = Object.keys(categoryTotals);
            const amounts = Object.values(categoryTotals);
            
            const backgroundColors = labels.map(label => {
                const colors = { 'Makanan': '#f97316', 'Pengangkutan': '#3b82f6', 'Membeli-belah': '#ec4899', 'Bil': '#ca8a04', 'Hiburan': '#a855f7', 'Lain-lain': '#64748b' };
                return colors[label] || '#64748b';
            });

            if (expenseChartInstance) {
                expenseChartInstance.data.labels = labels;
                expenseChartInstance.data.datasets[0].data = amounts;
                expenseChartInstance.data.datasets[0].backgroundColor = backgroundColors;
                expenseChartInstance.update();
            } else {
                expenseChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: labels, datasets: [{ data: amounts, backgroundColor: backgroundColors, borderWidth: 0, hoverOffset: 5 }] },
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } },
                        cutout: '70%'
                    }
                });
            }
        }

        // -- Borang Rekod Baru --
        document.getElementById('expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !auth.currentUser) return;

            const editId = document.getElementById('edit-record-id').value;
            const newRecord = {
                userEmail: currentUser.uid,
                type: document.getElementById('tx-type').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                description: document.getElementById('description').value,
                receipt: currentReceiptDataUrl,
                timestamp: editId ? expensesData.find(d => d.id === editId).timestamp : Date.now()
            };

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            submitBtn.disabled = true;

            try {
                const docId = editId ? editId : 'exp_' + Date.now() + Math.random().toString(36).substr(2, 6);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wangku_expenses', docId), newRecord);
                
                showToast(editId ? "Rekod dikemas kini!" : "Berjaya disimpan!");
                
                document.getElementById('amount').value = '';
                document.getElementById('description').value = '';
                document.getElementById('edit-record-id').value = '';
                window.removeReceipt();
                setDefaultDate();
                window.closeModal();
            } catch (err) {
                console.error(err);
                showToast("Ralat menyimpan data", "error");
            }
            
            submitBtn.innerHTML = 'Simpan Rekod';
            submitBtn.disabled = false;
        });

        window.deleteRecord = async (id) => {
            if (!currentUser || !auth.currentUser) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wangku_expenses', id));
                showToast("Rekod dipadam.");
            } catch (err) {
                console.error(err);
                showToast("Gagal memadam rekod", "error");
            }
        }

        // -- Logik UI & Ikon --
        function getCategoryIconInfo(category, isIncome) {
            if (isIncome) {
                const map = { 'Gaji': { icon: '💰', bg: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400' }, 'Elaun': { icon: '💵', bg: 'bg-teal-100 text-teal-600 dark:bg-teal-900/40 dark:text-teal-400' }, 'Bonus': { icon: '🎉', bg: 'bg-indigo-100 text-indigo-500 dark:bg-indigo-900/40 dark:text-indigo-400' }, 'Perniagaan': { icon: '🏪', bg: 'bg-blue-100 text-blue-500 dark:bg-blue-900/40 dark:text-blue-400' }, 'Lain-lain': { icon: '📥', bg: 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300' } };
                return map[category] || map['Lain-lain'];
            } else {
                const map = { 'Makanan': { icon: '🍔', bg: 'bg-orange-100 text-orange-500 dark:bg-orange-900/40 dark:text-orange-400' }, 'Pengangkutan': { icon: '🚗', bg: 'bg-blue-100 text-blue-500 dark:bg-blue-900/40 dark:text-blue-400' }, 'Membeli-belah': { icon: '🛍️', bg: 'bg-pink-100 text-pink-500 dark:bg-pink-900/40 dark:text-pink-400' }, 'Bil': { icon: '💡', bg: 'bg-yellow-100 text-yellow-600 dark:bg-yellow-900/40 dark:text-yellow-400' }, 'Hiburan': { icon: '🎬', bg: 'bg-purple-100 text-purple-500 dark:bg-purple-900/40 dark:text-purple-400' }, 'Lain-lain': { icon: '📦', bg: 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300' } };
                return map[category] || map['Lain-lain'];
            }
        }

        window.setTxType = (type) => {
            const btnExpense = document.getElementById('btn-expense');
            const btnIncome = document.getElementById('btn-income');
            const typeInput = document.getElementById('tx-type');
            const categorySelect = document.getElementById('category');
            
            typeInput.value = type;
            
            if (type === 'expense') {
                btnExpense.className = "flex-1 py-2 rounded-lg bg-white dark:bg-slate-600 shadow-sm text-rose-500 dark:text-rose-400 font-bold text-sm transition-all";
                btnIncome.className = "flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400 font-medium text-sm transition-all hover:bg-slate-200 dark:hover:bg-slate-600/50";
                categorySelect.innerHTML = `<option value="Makanan">🍔 Makanan & Minuman</option><option value="Pengangkutan">🚗 Pengangkutan</option><option value="Membeli-belah">🛍️ Membeli-belah</option><option value="Bil">💡 Bil & Utiliti</option><option value="Hiburan">🎬 Hiburan</option><option value="Lain-lain">📦 Lain-lain</option>`;
            } else {
                btnIncome.className = "flex-1 py-2 rounded-lg bg-white dark:bg-slate-600 shadow-sm text-emerald-500 dark:text-emerald-400 font-bold text-sm transition-all";
                btnExpense.className = "flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400 font-medium text-sm transition-all hover:bg-slate-200 dark:hover:bg-slate-600/50";
                categorySelect.innerHTML = `<option value="Gaji">💰 Gaji</option><option value="Elaun">💵 Elaun</option><option value="Bonus">🎉 Bonus</option><option value="Perniagaan">🏪 Perniagaan</option><option value="Lain-lain">📥 Lain-lain</option>`;
            }
        };

        // -- Pengurusan Modals & Views --
        window.openHistoryModal = () => {
            const modal = document.getElementById('history-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('translate-y-full'); }, 10);
            populateHistoryFilters();
            renderHistoryList('all');
        };

        window.closeHistoryModal = () => {
            const modal = document.getElementById('history-modal');
            modal.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        };

        window.filterHistory = () => renderHistoryList(document.getElementById('history-month-filter').value);

        function populateHistoryFilters() {
            const filter = document.getElementById('history-month-filter');
            filter.innerHTML = '<option value="all">Semua Bulan</option>';
            const months = new Set();
            expensesData.forEach(item => months.add(item.date.substring(0, 7)));
            const sortedMonths = Array.from(months).sort().reverse();
            sortedMonths.forEach(m => {
                const [year, month] = m.split('-');
                const monthName = new Date(year, month - 1).toLocaleDateString('ms-MY', { month: 'long', year: 'numeric' });
                filter.innerHTML += `<option value="${m}">${monthName}</option>`;
            });
        }

        function renderHistoryList(filterMonth) {
            const container = document.getElementById('history-list-container');
            container.innerHTML = '';
            let filteredData = filterMonth !== 'all' ? expensesData.filter(item => item.date.startsWith(filterMonth)) : expensesData;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-slate-400 dark:text-slate-500">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300 dark:text-slate-600"></i>
                        <p>Tiada rekod untuk pilihan ini.</p>
                    </div>`;
                return;
            }

            filteredData.forEach(item => {
                const amt = parseFloat(item.amount);
                const isIncome = item.type === 'income';
                let iconInfo = getCategoryIconInfo(item.category, isIncome);
                const dateStr = new Date(item.date).toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' });
                const amountStyle = isIncome ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400';
                
                let receiptBtnHtml = item.receipt 
                    ? `<button onclick="window.viewReceipt('${item.id}')" class="flex items-center gap-1 text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-2 py-1 rounded-lg mt-1 hover:bg-slate-200"><i class="fa-solid fa-receipt"></i> Resit</button>` 
                    : '';

                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl ${iconInfo.bg} flex items-center justify-center text-xl shadow-sm shrink-0">
                            ${iconInfo.icon}
                        </div>
                        <div>
                            <h4 class="font-semibold text-slate-700 dark:text-slate-200">${item.category}</h4>
                            <p class="text-xs text-slate-400 dark:text-slate-500 line-clamp-1">${dateStr} • ${item.description || 'Tiada keterangan'}</p>
                            ${receiptBtnHtml}
                        </div>
                    </div>
                    <div class="flex flex-col items-end justify-between min-h-[48px]">
                        <span class="font-bold ${amountStyle} whitespace-nowrap">${isIncome ? '+' : '-'}RM ${amt.toFixed(2)}</span>
                        <div class="flex gap-2 mt-2">
                            <button class="text-slate-300 dark:text-slate-500 hover:text-indigo-500 dark:hover:text-indigo-400 text-xs w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-700 flex items-center justify-center transition-colors shadow-sm" onclick="window.openEditModal('${item.id}')" title="Edit">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="text-slate-300 dark:text-slate-500 hover:text-rose-500 mt-2 text-xs w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-700 flex items-center justify-center transition-colors shadow-sm" onclick="window.deleteRecord('${item.id}')" title="Padam">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.openModal = () => {
            document.getElementById('modal-title').innerText = 'Tambah Rekod';
            document.getElementById('edit-record-id').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
            window.removeReceipt();
            setDefaultDate();
            
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('translate-y-full'); }, 10);
        };

        window.openEditModal = (id) => {
            const record = expensesData.find(item => item.id === id);
            if (!record) return;

            document.getElementById('modal-title').innerText = 'Edit Rekod';
            document.getElementById('edit-record-id').value = record.id;
            window.setTxType(record.type);
            document.getElementById('amount').value = record.amount;
            document.getElementById('category').value = record.category;
            document.getElementById('date').value = record.date;
            document.getElementById('description').value = record.description || '';
            
            if (record.receipt) {
                currentReceiptDataUrl = record.receipt;
                document.getElementById('receipt-preview-img').src = currentReceiptDataUrl;
                document.getElementById('receipt-preview-container').classList.remove('hidden');
            } else {
                window.removeReceipt();
            }

            const modal = document.getElementById('add-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('translate-y-full'); }, 10);
        };

        window.closeModal = () => {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        };

        // -- Pengurusan Resit (Imej) --
        window.handleReceiptUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Kecilkan kualiti/saiz resit supaya data tak berat
                    const MAX_SIZE = 500;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    currentReceiptDataUrl = canvas.toDataURL('image/jpeg', 0.6); // 60% kualiti
                    
                    document.getElementById('receipt-preview-img').src = currentReceiptDataUrl;
                    document.getElementById('receipt-preview-container').classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

        window.removeReceipt = () => {
            currentReceiptDataUrl = null;
            document.getElementById('receipt-input').value = '';
            document.getElementById('receipt-preview-container').classList.add('hidden');
            document.getElementById('receipt-preview-img').src = '';
        };

        window.viewReceipt = (id) => {
            const record = expensesData.find(item => item.id === id);
            if (record && record.receipt) {
                document.getElementById('receipt-full-img').src = record.receipt;
                const modal = document.getElementById('receipt-view-modal');
                modal.classList.remove('hidden'); modal.classList.add('flex');
            }
        };

        window.closeReceiptView = () => {
            const modal = document.getElementById('receipt-view-modal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
            document.getElementById('receipt-full-img').src = '';
        };

        window.openProfileModal = () => {
            if (!currentUser) return;
            const modal = document.getElementById('profile-modal');
            const content = document.getElementById('profile-modal-content');
            document.getElementById('profile-email-display').innerText = currentUser.uid;
            document.getElementById('profile-name').value = currentUser.displayName;
            document.getElementById('profile-password').value = ''; 
            document.getElementById('profile-password').type = 'password';
            document.getElementById('eye-icon-profile').className = 'fa-solid fa-eye';

            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('translate-y-full'); }, 10);
        };
        window.closeProfileModal = () => {
            const modal = document.getElementById('profile-modal');
            const content = document.getElementById('profile-modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        };

        window.openForgotModal = () => {
            const modal = document.getElementById('forgot-modal');
            const content = document.getElementById('forgot-modal-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
        };
        window.closeForgotModal = () => {
            const modal = document.getElementById('forgot-modal');
            const content = document.getElementById('forgot-modal-content');
            content.classList.remove('scale-100', 'opacity-100'); content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); document.getElementById('forgot-form').reset(); }, 300);
        };

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const newPass = document.getElementById('forgot-password-new').value;
            const btn = e.target.querySelector('button[type="submit"]');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
            btn.disabled = true;

            try {
                if (!auth || !auth.currentUser) throw new Error("Awan tidak sedia");
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'wangku_users', email);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    await setDoc(userRef, { password: newPass }, { merge: true });
                    showToast("Kata laluan berjaya ditukar!");
                    window.closeForgotModal();
                } else {
                    showToast("E-mel tidak dijumpai.", "error");
                }
            } catch (err) {
                showToast("Ralat pelayan awan", "error");
            }
            
            btn.innerHTML = 'Tukar Kata Laluan';
            btn.disabled = false;
        });

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !auth.currentUser) return;
            
            const newName = document.getElementById('profile-name').value;
            const newPassword = document.getElementById('profile-password').value;
            const btn = e.target.querySelector('button[type="submit"]');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            btn.disabled = true;

            try {
                const updateData = { name: newName };
                if (newPassword.trim() !== '') updateData.password = newPassword;
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wangku_users', currentUser.uid), updateData, { merge: true });
                
                currentUser.displayName = newName;
                document.getElementById('user-greeting').innerText = `Hai, ${currentUser.displayName}! 👋`;
                
                window.closeProfileModal();
                showToast("Profil berjaya dikemas kini!");
            } catch (err) {
                showToast("Ralat kemas kini profil", "error");
                console.error(err);
            }
            
            btn.innerHTML = 'Simpan Perubahan';
            btn.disabled = false;
        });

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const icon = toast.querySelector('i');
            msgEl.innerText = message;
            if (type === "error") icon.className = "fa-solid fa-circle-exclamation text-rose-400";
            else icon.className = "fa-solid fa-check-circle text-emerald-400";

            toast.classList.remove('opacity-0', '-translate-y-4'); toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-4'); toast.classList.remove('opacity-100', 'translate-y-0'); }, 3000);
        }

        function setDefaultDate() { document.getElementById('date').value = new Date().toISOString().split('T')[0]; }
        
        window.togglePassword = (inputId, iconId) => {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") { input.type = "text"; icon.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { input.type = "password"; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        };

        setDefaultDate();
        // initAuth() akan dipanggil secara automatik sebaik sahaja awan bersedia (di dalam fungsi initCloud).
    </script>
</body>
</html>
